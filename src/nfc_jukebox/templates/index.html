<!doctype html>
<title>Jukebox Admin</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 48rem; margin: 2rem auto; padding: 0 1rem; }
  table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
  td, th { text-align: left; padding: .4rem; border-bottom: 1px solid #ddd; }
  #uid { font-family: ui-monospace, monospace; font-size: 1.3rem; }
  .muted { color: #666; }
</style>

<h1>Jukebox</h1>
<p id="status" class="muted">…</p>
<p class="muted">Player controls, volume and speakers live in
  <a id="owntone" href="#">OwnTone</a>.</p>

<h2>Register a card</h2>
<p>Tap a card on the reader. Its ID appears here.</p>
<p id="uid">—</p>
<p id="known" class="muted">&nbsp;</p>
<label>Album <select id="album" onchange="syncName()"></select></label>
<label>Name <input id="name" placeholder="(optional)"></label>
<button id="save">Save</button>

<h2>Cards</h2>
<table><thead><tr><th>Name</th><th>Album</th><th>UID</th><th></th></tr></thead>
<tbody id="cards"></tbody></table>

<script>
// Tracks which card the dropdown was last auto-pointed at, so a selection the
// user is actively making is not yanked away on the next one-second poll.
let lastShownUid = null;

// OwnTone runs on the same host as this page. Built from location.hostname
// rather than the server's own config, which points at 127.0.0.1 - correct
// for the service, but as a link it would aim the browser at the viewer's
// own machine.
(function () {
  const a = document.getElementById('owntone');
  if (a) a.href = location.protocol + '//' + location.hostname + ':{{ owntone_port }}';
})();
// Everything below builds nodes and sets textContent rather than innerHTML:
// album folder names and card labels are arbitrary user text, and one folder
// named with an <img onerror=...> would otherwise run script on this page.
function el(tag, text) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  return node;
}
function cardRow(card) {
  const tr = el('tr');
  tr.append(el('td', card.name), el('td', card.path), el('td', card.uid));
  const button = el('button', 'Delete');
  button.addEventListener('click', () => del(card.uid));
  const cell = el('td');
  cell.append(button);
  tr.append(cell);
  return tr;
}
async function refresh() {
  const s = await (await fetch('/api/status')).json();
  document.getElementById('status').textContent =
    `${s.state}${s.now_playing ? ' \u2014 ' + s.now_playing : ''}` +
    (s.last_error ? ` \u00b7 ${s.last_error}` : '');
  if (s.last_seen_uid) document.getElementById('uid').textContent = s.last_seen_uid;

  // Say plainly whether this card is already assigned. Without this the page
  // shows a bare UID beside whatever album was last selected, which looks
  // like the card's current mapping.
  const known = document.getElementById('known') || {};
  if (!s.last_seen_uid) {
    known.textContent = '\u00a0';
  } else if (s.last_seen_known) {
    known.textContent = 'Registered to: ' + s.last_seen_name +
                        '  (' + s.last_seen_path + ')  \u2014 saving will reassign it';
    // Point the dropdown at what this card actually plays.
    const sel = document.getElementById('album');
    if (lastShownUid !== s.last_seen_uid &&
        [...sel.options].some(o => o.value === s.last_seen_path)) {
      sel.value = s.last_seen_path;
      syncName();
    }
  } else {
    known.textContent = 'Not registered yet \u2014 choose an album and Save to assign it.';
  }
  lastShownUid = s.last_seen_uid;

  // Only ever replace the table with a list we actually got. A failed or
  // malformed fetch - a service restart mid-poll, say - must leave the last
  // known registry on screen rather than blanking it, because an empty table
  // here reads as "my registrations are gone".
  const c = await (await fetch('/api/cards')).json();
  if (Array.isArray(c.cards)) {
    document.getElementById('cards').replaceChildren(...c.cards.map(cardRow));
  }
}

// refresh() runs once a second forever; an unhandled rejection would stop
// reporting errors silently. Surface it on the status line and carry on.
async function tick() {
  try {
    await refresh();
  } catch (e) {
    const st = document.getElementById('status');
    if (st) st.textContent = 'admin page cannot reach the jukebox \u2014 retrying\u2026';
  }
}
// The album path already names the record, so the name box is a convenience
// for friendly labels, not required entry. Mirror the album into it so it is
// obvious what will be stored, and leaving it alone costs nothing.
function syncName() {
  const album = document.getElementById('album').value || '';
  document.getElementById('name').placeholder =
    album.split('/').pop() || '(optional)';
}
async function loadAlbums() {
  const a = await (await fetch('/api/albums')).json();
  document.getElementById('album').replaceChildren(
    ...a.albums.map(x => el('option', x)));
  syncName();
}
async function save() {
  const uid = document.getElementById('uid').textContent;
  if (uid === '\u2014') return alert('Tap a card first.');
  const response = await fetch('/api/cards', {method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({uid,
      name: document.getElementById('name').value,
      path: document.getElementById('album').value})});
  if (!response.ok) {
    // Say why, rather than appearing to save and failing silently later.
    const body = await response.json().catch(() => ({}));
    return alert(body.error || `Could not save the card (${response.status}).`);
  }
  document.getElementById('name').value = '';
  refresh();
}
async function del(uid) {
  const response = await fetch('/api/cards/' + encodeURIComponent(uid),
                               {method: 'DELETE'});
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    alert(body.error || `Could not delete the card (${response.status}).`);
  }
  refresh();
}
document.getElementById('save').addEventListener('click', save);
loadAlbums(); tick(); setInterval(tick, 1000);
</script>
