[project]
name = "nfc-jukebox"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "PyYAML>=6.0",
    "Flask>=3.0",
    "nfcpy>=1.0",
    # Only for converting the occasional PNG cover into the JPEG the print
    # sheets embed. This used to be a call to `sips`, which ships with macOS
    # and does not exist on the Pi, so the sheets endpoint 500'd on the box.
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

# Flask resolves templates/ relative to the package directory. Without this,
# a non-editable install (pip install .) silently omits index.html and the
# admin page 500s on a missing template.
[tool.setuptools.package-data]
nfc_jukebox = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
