# deploy/dropins/NetworkManager-wait-online-any.conf
#   -> /etc/systemd/system/NetworkManager-wait-online.service.d/any.conf
#
# Wait for *a* network, not for every managed interface.
#
# The default waits for all of them, so a box configured for both Wi-Fi and
# ethernet sits through the full 60s timeout whenever one of the two is
# unplugged -- which, for this jukebox, is always: it runs on Wi-Fi, and the
# ethernet port is only ever used for diagnosis. That 60s is most of the time
# between power-on and being able to play a record.
#
# --any returns as soon as one interface has a usable address, so the normal
# case costs a few seconds and plugging ethernet in still works.
#
# Note the absence of -s, which the stock unit carries. -s waits for
# NetworkManager to finish *starting*, not for a connection, so with --any it
# returns immediately: network-online.target was reached a full tenth of a
# second before wlan0 even reached "disconnected", and the NAS mount then
# failed with "Network is unreachable". Without -s this waits for a device to
# actually be connected, which is the thing the mount needs.
[Service]
ExecStart=
ExecStart=/usr/bin/nm-online -q --timeout=45 --any
