# deploy/dropins/journald-persistent.conf
#   -> /etc/systemd/journald.conf.d/persistent.conf
#
# The journal is volatile by default, so every reboot erases the evidence. That
# cost three separate diagnoses in one day: the Wi-Fi outage, whether the
# rescan cron had ever run, and the reader glitch -- each time the answer was
# in a boot that no longer existed.
#
# Capped, because this is an SD card and an unbounded journal is how they die.
[Journal]
Storage=persistent
SystemMaxUse=50M
SystemMaxFileSize=10M
# Keep at least a fortnight if the size cap allows it: the failures here are
# intermittent and get reported days later.
MaxRetentionSec=2week
