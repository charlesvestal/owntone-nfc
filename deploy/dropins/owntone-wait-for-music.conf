# deploy/dropins/owntone-wait-for-music.conf
#   -> /etc/systemd/system/owntone.service.d/mount.conf
#
# OwnTone must not start before the library is mounted: if it does, the music
# stays unavailable even after the mount appears, and only a full rescan
# recovers it (upstream issue #690).
#
# RequiresMountsFor alone is not enough on a Wi-Fi box. It is evaluated once,
# at boot, and network-online.target is reached before the radio has actually
# associated - measured at three seconds early, which is plenty for the CIFS
# mount to fail with "Network is unreachable". systemd then gives up on
# OwnTone permanently, while the automount quietly succeeds twenty seconds
# later on first access. The result is a box with a working library and no
# music server.
#
# So rather than tighten an ordering race that has already been wrong twice,
# wait for the thing itself. Touching the path triggers the automount, and the
# loop tolerates a network that is not ready yet.
[Unit]
RequiresMountsFor=
After=network-online.target

[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 1 60); do ls /srv/music/. >/dev/null 2>&1 && exit 0; sleep 2; done; echo "library never appeared" >&2; exit 1'
Restart=on-failure
RestartSec=15
